{% extends "base.html" %}

{% block title %}Присоединиться к игре{% endblock %}

{% block content %}
<form class="menu" method="post">
    <div style="padding: 10px 15px; background-color: rgb(255 255 255 / 50%);">
        <label for="join_code">Введите код приглашения</label>
        <input name="join_code" id="join_code" required>
    </div>
    {% if request.query_params.get("error") != None %}
        <h3 style="color: red;">Неправильный код приглашения</h3>
    {% endif %}
    <button class="big_button">Присоединиться</button>
    <a href="{{url_for('main_page')}}"><button class="big_button" type="button">Вернуться на главную</button></a>
</form>
{% endblock %}

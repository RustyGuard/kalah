{% extends "base.html" %}

{% block title %}Комната ожидания{% endblock %}

{% block content %}
<div>Количество лунок на игрока: {{holes_count}}</div>
<div>Количество камней на лунку: {{stones_count}}</div>
<div>Код приглашения: {{join_code}}</div>
<a href="{{url_for('main_page')}}">Вернуться на главную</a>
<script>
    var ws = new WebSocket("ws://localhost:8000/waiting_room/{{settings_id}}/ws");
    ws.onmessage = function(event) {
        window.location.replace("/game_board/{{settings_id}}")
    }
</script>
{% endblock %}

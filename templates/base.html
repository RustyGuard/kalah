<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}{% endblock %}</title>
    <link href="{{ url_for('static', path='css/index.css') }}" rel="stylesheet">
    {% block head %}{% endblock %}
    <script>
        function setTheme() {
            document.documentElement.className = localStorage.getItem("visual_theme");
        };

        document.onload = setTheme();
    </script>
</head>
<body>
{% block content %}{% endblock %}
</body>
</html>

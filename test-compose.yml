version: "3.8"

services:
  test_db:
    image: postgres:12
    environment:
      POSTGRES_DB: "test_mydatabase"
      POSTGRES_USER: "myuser"
      POSTGRES_PASSWORD: "mypassword"
      expose: "5432"
  run_pytest:
    build: .
    stdin_open: true
    tty: true
    command:
      - uv run pytest
    environment:
      POSTGRES_SERVER: test_db:5432
    depends_on:
      - test_db
